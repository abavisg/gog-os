[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gogos"
version = "0.1.0"
description = "Local-first Claude Code-native personal operating system"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client",
  "google-auth-httplib2",
  "google-auth-oauthlib",
  "python-dotenv",
  "pydantic",
  "rich",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["gogos*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly (ruff's defaults today) so a ruff upgrade cannot widen the
# rule set and let the finding count creep. Widen deliberately, in its own PR.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
